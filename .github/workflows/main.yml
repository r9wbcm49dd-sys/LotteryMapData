name: Lottery API Test

on:
  workflow_dispatch:

  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Update Lottery Data
        run: |
          python3 << 'EOF'
          import csv
          import requests
          from io import StringIO

          games = [
              (2, "csv/twocharms_day.csv"),
              (5, "csv/twocharms_night.csv"),
              #(3, "csv/hint3_day.csv"),
              #(6, "csv/hint3_night.csv"),
              #(4, "csv/4Sight_day.csv"),
              #(7, "csv/4Sight_night.csv"),
              #(8, "csv/luckywizard.csv"),
              #(10, "csv/powerme.csv")
          ]

          #url = "https://wordpresswebapi.azurewebsites.net/api/ElectronicDrawing/ElectronicDrawingDateSearch/2/2026-06-14/2026-06-19%2023:59"

          for game_id, csv_path in games:

            url = f"https://wordpresswebapi.azurewebsites.net/api/ElectronicDrawing/ElectronicDrawingDateSearch/{game_id}/2026-06-14/2026-06-19%2023:59"
        
            print("")
            print("PROCESSING:", csv_path)
        
            data = requests.get(url).json()
        
            with open(csv_path, "r", newline="") as f:
                reader = csv.DictReader(f)
                rows = list(reader)
        
            existing_dates = {row["date"] for row in rows}
        
            added = 0
        
            for draw in data:
        
                draw_date = draw["drawingDate"][:10]
        
                if draw_date in existing_dates:
                    continue
        
                result = draw["results"].zfill(2)
        
                rows.append({
                    "date": draw_date,
                    "p1": result[0],
                    "p2": result[1],
                    "number": result
                })
        
                existing_dates.add(draw_date)
                added += 1
        
                print("ROW ADDED:", draw_date, result)
        
            rows.sort(key=lambda row: row["date"])
        
            with open(csv_path, "w", newline="") as f:
        
                writer = csv.DictWriter(
                    f,
                    fieldnames=["date", "p1", "p2", "number"]
                )
        
                writer.writeheader()
                writer.writerows(rows)
        
            print("ROWS ADDED:", added)
        
            if rows:
                print("LAST ROW:", rows[-1])
          EOF
                  

      - name: Commit and Push
        run: |
          git config user.name "LotteryMap Bot"
          git config user.email "actions@github.com"

          git add csv/*.csv

          git diff --staged --quiet || git commit -m "Auto update lottery data"

          git push
