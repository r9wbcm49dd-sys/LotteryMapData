name: Lottery API Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Update TwoCharms Day
        run: |
          python3 << 'EOF'
          import requests

          url = "https://wordpresswebapi.azurewebsites.net/api/ElectronicDrawing/ElectronicDrawingDateSearch/2/2026-06-14/2026-06-19%2023:59"

          data = requests.get(url).json()

          with open("csv/twocharms_day.csv", "r") as f:
              rows = f.read().strip().splitlines()

          existing_dates = set()

          for row in rows[1:]:
              if row.strip():
                  existing_dates.add(row.split(",")[0])

          rows_added = 0

          with open("csv/twocharms_day.csv", "a") as f:

              for draw in data:

                  draw_date = draw["drawingDate"][:10]

                  if draw_date in existing_dates:
                      continue

                  result = draw["results"].zfill(2)

                  p1 = result[0]
                  p2 = result[1]

                  new_row = f"{draw_date},{p1},{p2},{result}"

                  f.write("\n" + new_row)

                  rows_added += 1

                  print("ROW ADDED:", new_row)

          print("")
          print("ROWS ADDED:", rows_added)
          EOF

      - name: Commit and Push
        run: |
          git config user.name "LotteryMap Bot"
          git config user.email "actions@github.com"

          git add csv/twocharms_day.csv

          git diff --staged --quiet || git commit -m "Auto update twocharms_day"

          git push
