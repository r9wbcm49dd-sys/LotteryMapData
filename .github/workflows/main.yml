name: Lottery API Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Convert API to LotteryMap Format
        run: |
          python3 << 'EOF'
          import requests

          url = "https://wordpresswebapi.azurewebsites.net/api/ElectronicDrawing/ElectronicDrawingDateSearch/2/2026-06-18/2026-06-19%2023:59"

          data = requests.get(url).json()

          last = data[-1]

          date = last["drawingDate"][:10]

          result = last["results"].zfill(2)

          p1 = result[0]
          p2 = result[1]

          print("")
          print("LOTTERYMAP ROW")
          print(f"{date},{p1},{p2},{result}")
          print("")
          EOF
