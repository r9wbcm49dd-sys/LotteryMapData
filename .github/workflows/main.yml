name: Lottery API Test

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */8 * * *'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Update Lottery Data
        run: |
          python3 << 'EOF'
          import csv
          import requests
          from io import StringIO
          from datetime import datetime, timedelta

          end_date = datetime.utcnow()
          start_date = end_date - timedelta(days=7)
          
          start_str = start_date.strftime("%Y-%m-%d")
          end_str = end_date.strftime("%Y-%m-%d") + "%2023:59"

          games = [
              (2, "csv/twocharms_day.csv"),
              (5, "csv/twocharms_night.csv"),
              (3, "csv/hint3_day.csv"),
              (6, "csv/hint3_night.csv"),
              (4, "csv/4Sight_day.csv"),
              (7, "csv/4Sight_night.csv"),
              (8, "csv/luckywizard.csv"),
              (10, "csv/powerme.csv")
          ]

          for game_id, csv_path in games:

            url = (
                f"https://wordpresswebapi.azurewebsites.net/api/"
                f"ElectronicDrawing/ElectronicDrawingDateSearch/"
                f"{game_id}/{start_str}/{end_str}"
            )
        
            print("")
            print("PROCESSING:", game_id, csv_path)
        
            data = requests.get(url).json()
        
        
            with open(csv_path, "r", newline="") as f:
                reader = csv.DictReader(f)
                rows = list(reader)
        
            if game_id == 8:
                existing_dates = {row["Date"] for row in rows}

            elif game_id == 10:
                existing_dates = {row["Draw Date"] for row in rows}
            else:
                existing_dates = {row["date"] for row in rows}
        
            added = 0
        
            
            for draw in data:
    
                draw_date = draw["drawingDate"][:10]
    
                if draw_date in existing_dates:
                    continue
    
                if game_id in [2, 5]:
    
                    result = draw["results"].zfill(2)
    
                    rows.append({
                        "date": draw_date,
                        "p1": result[0],
                        "p2": result[1],
                        "number": result
                    })
    
                elif game_id in [3, 6]:
    
                    result = draw["results"].zfill(3)
    
                    rows.append({
                        "date": draw_date,
                        "p1": result[0],
                        "p2": result[1],
                        "p3": result[2],
                        "number": result
                    })

                elif game_id in [4, 7]:
    
                    result = draw["results"].zfill(4)
    
                    rows.append({
                        "date": draw_date,
                        "p1": result[0],
                        "p2": result[1],
                        "p3": result[2],
                        "p4": result[3],
                        "number": result
                    })

                elif game_id == 8:
    
                    result = draw["results"].split("-")
    
                    rows.append({
                        "Date": draw_date,
                        "P1": result[0],
                        "P2": result[1],
                        "P3": result[2],
                        "P4": result[3],
                        "P5": result[4],
                        "Red": result[5]
                    })


                elif game_id == 10:
    
                    result = draw["results"].split("-")
    
                    rows.append({
                        "Draw Date": draw_date,
                        "P1": result[0],
                        "P2": result[1],
                        "P3": result[2],
                        "P4": result[3],
                        "P5": result[4],
                        "Powerball": draw["extraBall"]
                    })

                existing_dates.add(draw_date)
                added += 1
    
                print("ROW ADDED:", draw_date, result)
    
            if game_id == 8:
                rows.sort(key=lambda row: row["Date"])

            elif game_id == 10:
                rows.sort(key=lambda row: row["Draw Date"])
            else:
                rows.sort(key=lambda row: row["date"])
    
            with open(csv_path, "w", newline="") as f:
    
                if game_id in [2, 5]:
    
                    fieldnames = [
                        "date",
                        "p1",
                        "p2",
                        "number"
                    ]
    
                elif game_id in [3, 6]:
    
                    fieldnames = [
                        "date",
                        "p1",
                        "p2",
                        "p3",
                        "number"
                    ]

                elif game_id in [4, 7]:
    
                    fieldnames = [
                        "date",
                        "p1",
                        "p2",
                        "p3",
                        "p4",
                        "number"
                    ]


                elif game_id == 8:
    
                    fieldnames = [
                        "Date",
                        "P1",
                        "P2",
                        "P3",
                        "P4",
                        "P5",
                        "Red"
                    ]

                elif game_id == 10:
    
                    fieldnames = [
                        "Draw Date",
                        "P1",
                        "P2",
                        "P3",
                        "P4",
                        "P5",
                        "Powerball"
                    ]
                    
    
                writer = csv.DictWriter(
                    f,
                    fieldnames=fieldnames
                )
    
                writer.writeheader()
                writer.writerows(rows)
    
            print("ROWS ADDED:", added)
    
            if rows:
                print("LAST ROW:", rows[-1])
          EOF
                  

      - name: Commit and Push
        run: |
          git config user.name "LotteryMap Bot"
          git config user.email "actions@github.com"

          git add csv/*.csv

          git diff --staged --quiet || git commit -m "Auto update lottery data"

          git push
